name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test the pure-Swift core
        run: swift test

  app-macos:
    name: Package tests and app build (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    env:
      # Xcode 26 (Swift 6.2, macOS 26 SDK): the toolchain the app is built with on the Mac, so the
      # `#if compiler(>=6.2)` / macOS 26 branches compile here too. The deployment target stays macOS 14.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Package tests (core + data)
        run: swift test
      - name: Build the app (unsigned, sandbox entitlements kept)
        run: |
          xcodebuild \
            -project App/FA.xcodeproj \
            -scheme FA \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
