name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test the pure-Swift core
        run: swift test

  app-macos:
    name: Package tests and app build (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Package tests (core + data)
        run: swift test
      - name: Build the app (unsigned, sandbox entitlements kept)
        run: |
          xcodebuild \
            -project App/FA.xcodeproj \
            -scheme FA \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
